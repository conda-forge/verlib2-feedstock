{% set name = "verlib2" %}
{% set version = "26.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/verlib2-{{ version }}.tar.gz
  sha256: 0740a3b35755a9d8ebb933ffce989f3776113fe319ab62df5fa20f7c14343d58

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools >=42
    - versioningit
    - pip
  run:
    - python >=3.6

test:
  imports:
    - verlib2
  commands:
    - pip check
  requires:
    - pip

about:
  summary: A standalone variant of packaging.version, without anything else.
  home: https://github.com/panodata/verlib2
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
